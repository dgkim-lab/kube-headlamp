apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -plugins-dir=/headlamp/plugins
            - -oidc-callback-url=https://headlamp.k3s-test.dgkim.net/oidc-callback
            - -oidc-ca-file=/etc/headlamp/oidc-ca/ca.crt
          env:
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-id
                  optional: true
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
                  optional: true
            - name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: issuer-url
                  optional: true
            - name: HEADLAMP_CONFIG_OIDC_SCOPES
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: scopes
                  optional: true
          ports:
            - name: http
              containerPort: 4466
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: oidc-ca
              mountPath: /etc/headlamp/oidc-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
      volumes:
        - name: oidc-ca
          configMap:
            name: headlamp-oidc-ca
