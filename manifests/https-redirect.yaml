apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-https-redirect
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-http-redirect
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-headlamp-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.k3s.dgkim.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
